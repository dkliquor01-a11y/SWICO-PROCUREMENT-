<html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#FFC400">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f5f5f2;--card:#fff;--tx:#1b1b18;--mu:#6c6c63;--ln:#e6e4da;--ac:#FFC400;--acs:#FFF3C4;--acd:#7a5800;--wa:#d9730d;--was:#FFE9CF;--er:#c62828;--ers:#FDE3E1}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--ac),var(--ac)) top/100% env(safe-area-inset-top,0px) no-repeat,var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;padding-bottom:84px}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--ac);position:sticky;top:env(safe-area-inset-top,0px);z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header .mu{color:#4a3d00;font-size:12px}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
h1 i,.xx{width:28px;height:28px;border-radius:8px;background:var(--tx);color:var(--ac);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:800}

.lg{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.lg img{height:30px;width:auto;display:block}
h3{margin:14px 0 8px;font-size:17px}h4{margin:16px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
main{padding:10px 14px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);font-size:10px;padding:2px 1px;cursor:pointer}
nav button b{display:block;width:46px;margin:0 auto 2px;padding:4px 0;border-radius:99px}
nav button svg,#gb svg,#tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto}
#gb svg,#tb svg{width:19px;height:19px}
nav .on{color:var(--tx);font-weight:700}nav .on b{background:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0;border-top:3px solid var(--ac)}
.k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}.v{font-size:19px;font-weight:750}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--acd);font-weight:650;white-space:nowrap}
.chip.w{background:var(--was);color:var(--wa)}.chip.e{background:var(--ers);color:var(--er)}
button.p,button.s{border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--ln)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--tx)}
button.s{background:#fff;color:var(--tx)}
button.d{color:var(--er);border-color:var(--er)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx);font:inherit;margin:3px 0 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
input,select,textarea{font-size:16px!important}
html,body{touch-action:manipulation}
label{font-size:12px;color:var(--mu);font-weight:600}
#m{position:fixed;inset:0;background:rgba(20,20,10,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#m>div{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--ac)}
.steps{display:flex;gap:3px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--ac)}
.bar{display:flex;gap:6px;margin:8px 0}.bar>*{flex:1;margin:0}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.25);border-radius:99px!important;padding:12px 20px!important}
a{color:var(--acd);font-weight:600}
@media print{body>*:not(#m){display:none!important}#m{position:static!important;display:block!important;background:none!important}#m>div{max-height:none!important;padding:0!important;background:none!important;border-radius:0!important;border:0!important}.noprint{display:none!important}body{padding:0!important;background:#fff}#doc{border:0!important}}
@media print{body.rp{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--ln:#bbb;background:#fff}body.rp>main#v{display:block!important}body.rp .fab{display:none!important}}
</style></head><body>
<header><h1><span class="lg"><img id="lg" alt="SWICO"></span>ProcureTrack</h1><span><span class="mu" id="st"></span> <button class="s" id="tb" aria-label="Team" onclick="teamUI()" style="padding:5px 8px;line-height:0;margin-left:6px"></button><button class="s" onclick="settingsForm()" id="gb" aria-label="Settings" style="padding:5px 8px;line-height:0;margin-left:6px"></button><button class="s" onclick="logout()" style="padding:5px 10px;margin-left:6px;font-size:12px">Sign out</button></span></header>
<div id="who" class="mu" style="padding:8px 16px 0"></div>
<div id="auth" style="position:fixed;inset:0;background:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px"><img id="lg2" alt="SWICO" style="height:64px"><h2 style="margin:10px 0 2px">ProcureTrack</h2><div class="mu" style="margin-bottom:14px">Procurement &amp; stock management · members only</div><div style="width:100%;max-width:340px"><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div id="am" class="mu" style="color:var(--er);min-height:20px"></div><button class="p" style="width:100%" onclick="login()">Sign in</button><div style="text-align:center;margin-top:12px"><a href="#" onclick="forgot();return false">Forgot password?</a></div></div></div>
<main id="v"></main><nav id="n"></nav><div id="m"></div>
<script>
const STAGES=['Requested','RFQ Issued','Quotations In','Selected','Approved','LPO Issued','Delivered','With Finance','Paid'];
const METHODS=['RFQ','Petty Cash','Sole Sourcing','RFP','MOU'];
const SUPABASE_URL='https://vhdwqfyhrkdbghhyxjlo.supabase.co',SUPABASE_ANON_KEY='sb_publishable_I3FJgX-XxMyqwlbDVxHr2A_m9MYKThh';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let FORCE=false,RECOVER=false;sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')RECOVER=true});
let ROLE='',NAME='',SIGN_AS=[];
const ROLES={sysadmin:'Administrator',executive:'Executive (view & sign)',committee:'Committee member',procurement_officer:'Procurement officer',stock_manager:'Stock manager'};
const RR={procurement_officer:['pr','sup','sig','cfg','grn'],stock_manager:['item','mv','grn','book','asset','pr','cfg']};
const RW={procurement_officer:['pr','sup'],stock_manager:['item','mv','grn','book','asset'],sysadmin:['cfg']};
const canR=c=>['sysadmin','executive','committee'].includes(ROLE)||(RR[ROLE]||[]).includes(c);
const canW=c=>(RW[ROLE]||[]).includes(c);
const TAB_ROLES={pr:['procurement_officer','committee','executive','sysadmin'],sup:['procurement_officer','committee','executive','sysadmin'],item:['stock_manager','committee','executive','sysadmin'],book:['stock_manager','committee','executive','sysadmin'],grn:['stock_manager','committee','executive','sysadmin']};
const tabOk=t=>!TAB_ROLES[t]||TAB_ROLES[t].includes(ROLE);
const secOk=s=>s==='pr'?ROLE!=='stock_manager':ROLE!=='procurement_officer';
const claude={use:async n=>{if(n==='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/html'}));a.download=filename;a.click()}};throw new Error('n/a')}};
const mkdb=()=>({collection:k=>({
 doc:id=>({set:async o=>{const row={collection:k,id,data:o};const{error}=await(k==='sig'?sb.from('records').insert(row):sb.from('records').upsert(row));if(error)throw error},delete:async()=>{const{error}=await sb.from('records').delete().eq('collection',k).eq('id',id);if(error)throw error}}),
 onSnapshot:(cb,er)=>{const load=async()=>{const{data,error}=await sb.from('records').select('id,data').eq('collection',k);if(error)return er&&er(error);cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})};load();sb.channel('rec-'+k).on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'collection=eq.'+k},load).subscribe()}})});

const PFX=[['procurement','Procurement officer'],['stockmanager','Stock manager'],['cfo','Chief Finance Officer'],['legal','Head Legal'],['corporate','Manager Corporate Affairs'],['hra','Senior HRA'],['headit','Head IT'],['ceo','CEO'],['admin','Administrator']];
async function callFn(body){const{data,error}=await sb.functions.invoke('add-member',{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
async function teamUI(res){const{data,error}=await sb.from('profiles').select('id,email,name,role,active').order('email');if(error)return alert(error.message);const{data:{user}}=await sb.auth.getUser();
 openM(`<div class="row"><h3 style="margin:0">Team</h3><button class="s" onclick="closeM()">✕</button></div>
 ${res?`<div class="card" style="border-color:var(--ac)"><b>${esc(res.title)}</b><p>Email: <b>${esc(res.email)}</b><br>Temporary password: <b style="font-size:17px">${esc(res.password)}</b></p><div class="mu">Give these to the member privately. They must choose their own password when they first sign in. This password is not shown again.</div></div>`:''}
 <div class="card"><b>Add a member</b><label>Role</label><select id="tp">${PFX.filter(x=>x[0]!=='admin'||ROLE==='sysadmin').map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><label>Full name</label><input id="tn" placeholder="e.g. Jane Doe"><button class="p" style="width:100%" onclick="teamAdd()">Create account</button><div class="mu" style="margin-top:6px">The email is made automatically, e.g. stockmanager02@swico.co.ug.</div></div>
 ${data.map(m=>`<div class="card"><div class="row"><b>${esc(m.name)}</b>${chip(m.active?'Active':'Disabled',m.active?'':'e')}</div><div class="mu">${esc(m.email)} · ${esc(ROLES[m.role]||m.role)}</div>${m.id===user.id||(m.role==='sysadmin'&&ROLE!=='sysadmin')?'':`<div class="bar"><button class="s" onclick="teamAct('reset','${m.id}')">Reset password</button><button class="s ${m.active?'d':''}" onclick="teamAct('set_active','${m.id}',${!m.active})">${m.active?'Disable':'Enable'}</button></div>`}</div>`).join('')}`)}
async function teamAdd(){const prefix=$('tp').value,name=$('tn').value.trim();if(name.length<2)return alert('Enter the full name.');try{const r=await callFn({action:'create',prefix,name});teamUI({title:'Account created',email:r.email,password:r.password})}catch(e){alert(e.message)}}
async function teamAct(action,id,active){try{const r=await callFn({action,id,active});action==='reset'?teamUI({title:'Password reset',email:r.email,password:r.password}):teamUI()}catch(e){alert(e.message)}}
function pwForm(force,rec){FORCE=!!force;openM(`<h3 style="margin-top:0">${force?'Set your own password':'Change password'}</h3>${force?'<p class="mu">Choose a private password that only you know.</p>':''}${rec?'':'<label>Current password</label><input id="pw0" type="password" autocomplete="current-password">'}<label>New password (at least 8 characters)</label><input id="pw1" type="password" autocomplete="new-password"><label>Repeat new password</label><input id="pw2" type="password" autocomplete="new-password"><div class="bar">${force?'':'<button class="s" onclick="closeM()">Cancel</button>'}<button class="p" onclick="pwSave()">Save</button></div>`)}
async function pwSave(){const rec=!$('pw0'),a=rec?'':$('pw0').value,b=$('pw1').value,c=$('pw2').value;if(b.length<8)return alert('Use at least 8 characters.');if(b!==c)return alert('The two new passwords do not match.');if(!rec&&b===a)return alert('Choose a different password.');
 if(!rec){const{data:{user}}=await sb.auth.getUser();const r=await sb.auth.signInWithPassword({email:user.email,password:a});if(r.error)return alert('Your current password is wrong.')}
 const{error}=await sb.auth.updateUser({password:b,data:{must_change_password:false}});if(error)return alert(error.message);FORCE=false;RECOVER=false;closeM();alert('Password changed.')}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('touchmove',x=>{if(x.touches.length>1)x.preventDefault()},{passive:false});
function showAuth(m){$('auth').style.display='flex';$('am').textContent=m||''}
async function login(){$('am').textContent='';const{data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return $('am').textContent=error.message;enter(data.user)}
async function forgot(){const e=$('em').value.trim();if(!e)return $('am').textContent='Enter your email first.';const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});$('am').textContent=error?error.message:'Check your email for a reset link.'}
async function logout(){await sb.auth.signOut();location.reload()}
async function enter(u){const{data:pf}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
 if(!pf||!pf.active){await sb.auth.signOut();return showAuth('This account has no access. Please contact the administrator.')}
 ROLE=pf.role;NAME=pf.name;SIGN_AS=pf.sign_as||[];$('auth').style.display='none';db=mkdb();R.sec=secOk('pr')?'pr':'st';
 $('who').innerHTML=esc(NAME)+' · '+esc(ROLES[ROLE])+(SIGN_AS.length?' · signs as '+esc(SIGN_AS.join(', ')):'')+' · <a href="#" onclick="pwForm();return false">Change password</a>';
 ['pr','sup','item','mv','grn','book','asset','cfg','sig'].filter(canR).forEach(k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));render();if(u.user_metadata&&u.user_metadata.must_change_password)pwForm(true);else if(RECOVER)pwForm(true,true)}
async function init(){$('lg2').src=LOGO;const{data:{session}}=await sb.auth.getSession();session?enter(session.user):showAuth()}
async function openDoc(path){const w=window.open('','_blank');const{data,error}=await sb.storage.from('docs').createSignedUrl(path,300);if(error||!data){if(w)w.close();return alert('Cannot open document.')}if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
const S={pr:[],sup:[],item:[],mv:[],grn:[],book:[],asset:[],cfg:[],sig:[]};let tab='dash',db=null,flt='',q='';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString(),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
const get=(k,id)=>S[k].find(x=>x.id===id);
function persist(){try{localStorage.setItem('pt',JSON.stringify(S))}catch(e){}}
async function save(k,o){if(!canW(k)&&!(k==='sig'&&SIGN_AS.includes(o.role)))return alert('You do not have permission to change this.');if(k==='pr'){o={...o};delete o.appr;delete o.stage}const i=S[k].findIndex(x=>x.id===o.id);i<0?S[k].push(o):S[k][i]=o;if(db){try{await db.collection(k).doc(o.id).set(o)}catch(e){alert('Save failed: '+(e.message||e.code))}}else persist();render()}
const paid=p=>+p.paid||0,inv=p=>+p.invoiced||0;
const payStat=p=>{const a=+p.contract||+p.approved||inv(p);return paid(p)<=0?'Unpaid':(paid(p)>=Math.max(inv(p),a)&&a>0?'Paid':'Partial')};
const qty=id=>S.mv.filter(m=>m.item===id).reduce((a,m)=>a+(m.type==='OUT'?-m.qty:m.qty),0);
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;

 const inv=sumBy(P,p=>p.invoiced),pd=sumBy(P,p=>p.paid);
 return `<h3>Procurement report · ${rLabel()}</h3><div class="grid">${RC('Requests raised',P.length)}${RC('Completed (paid)',P.filter(p=>p.stage==='Paid').length)}${RC('Estimated budget',fmt(sumBy(P,p=>p.approved)))}${RC('Contract value',fmt(sumBy(P,p=>p.contract)))}${RC('Invoiced',fmt(inv))}${RC('Paid',fmt(pd))}${RC('Outstanding',fmt(Math.max(inv-pd,0)))}${RC('Petty cash (count · paid)',P.filter(isPetty).length+' · '+fmt(sumBy(P.filter(isPetty),p=>p.paid)))}${RC('Payments made in period',fmt(sumBy(pays,p=>p.paid)))}</div>
 <div class="card"><b>Money flow: budget → contract → invoiced → paid</b>${hbar([['Est. budget',sumBy(P,p=>p.approved)],['Contract',sumBy(P,p=>p.contract)],['Invoiced',inv],['Paid',pd]],'ac')}</div>
 <div class="card"><b>Money over the period: invoiced vs paid</b>${vbars(bLabels(),[{n:'Invoiced',v:series(S.pr,p=>p.invDate,p=>p.invoiced),c:'wa'},{n:'Paid',v:series(S.pr,p=>p.payDate,p=>p.paid),c:'ac'}])}</div>
 <div class="card"><b>Contract value by department</b>${hbar(grp(P,p=>(p.dept||'').trim()).map(([k,L])=>[k,sumBy(L,p=>p.contract)]),'wa')}</div>
 <div class="card"><b>Paid by supplier</b>${hbar(grp(P.filter(p=>p.supplier),p=>p.supplier).map(([k,L])=>[k,sumBy(L,p=>p.paid)]),'ac')}</div>
 <div class="card"><b>Progress of requests</b>${T(['Stage','Requests'],STAGES.map(s=>[s,P.filter(p=>p.stage===s).length]))}</div>
 <div class="card"><b>By method</b>${T(['Method','Requests','Contract'],grp(P,p=>p.method).map(([k,L])=>[esc(k),L.length,fmt(sumBy(L,p=>p.contract))]))}<div class="mu" style="margin-top:6px">Sole-sourced (emergency): ${ss.length}</div>${ss.map(p=>`<div class="mu">• ${esc(p.ref)}: ${esc(p.emergency||'')}</div>`).join('')}</div>
 <div class="card"><b>By department</b>${T(['Department','Requests','Contract','Paid'],grp(P,p=>(p.dept||'').trim()).map(([k,L])=>[esc(k),L.length,fmt(sumBy(L,p=>p.contract)),fmt(sumBy(L,p=>p.paid))]))}</div>
 <div class="card"><b>Suppliers awarded</b>${T(['Supplier','Awards','Contract','Paid'],grp(P.filter(p=>p.supplier),p=>p.supplier).map(([k,L])=>[esc(k),L.length,fmt(sumBy(L,p=>p.contract)),fmt(sumBy(L,p=>p.paid))]))}</div>
 <div class="card"><b>Item rates in period vs previous purchase</b>${T(['Item','Rate','Previous','Change'],P.filter(p=>+p.qty>0&&+p.contract>0).map(p=>{const pts=itemPts(p.desc),i=pts.findIndex(x=>x.p.id===p.id),pr=i>0?pts[i-1].r:0,r=rateOf(p,p.contract);return [esc(p.desc),fmt(Math.round(r)),pr?fmt(Math.round(pr)):'—',pr?pct(r,pr):'—']}))}<div class="mu">Enter quantity on each request to see rates. See “Item accounts” for full history.</div></div>
 <div class="card"><b>Overdue deliveries (as of today)</b>${od.map(p=>`<div class="mu">• ${esc(p.ref)} ${esc(p.desc)} · ${esc(p.supplier)}</div>`).join('')||'<div class="mu">None</div>'}</div>
 <div class="card"><b>Requests in period</b>${T(['Ref','Item','Supplier','Stage','Contract','Paid'],P.map(p=>[esc(p.ref),esc(p.desc),esc(p.supplier||'—'),p.stage,fmt(p.contract),fmt(p.paid)]))}</div>`}
function repST(){const[a]=rng(),M=S.mv.filter(m=>inR(m.date)),sg=m=>m.type==='OUT'?-m.qty:m.qty;
 const rows=S.item.map(i=>{const op=S.mv.filter(m=>m.item===i.id&&(m.date||'').slice(0,10)<a).reduce((x,m)=>x+sg(m),0),L=M.filter(m=>m.item===i.id),inn=L.filter(m=>m.type!=='OUT').reduce((x,m)=>x+m.qty,0),out=L.filter(m=>m.type==='OUT').reduce((x,m)=>x+m.qty,0);return{n:i.name,u:i.unit||'',op,inn,out,cl:op+inn-out}});
 const G=S.grn.filter(g=>inR(g.date)),B=S.book.filter(x=>inR(x.date)),A=S.asset.filter(x=>inR(x.date)),q=x=>x.lines.reduce((t,l)=>t+l.qty,0);
 const dep=grp(B,x=>(x.dept||'').trim()).map(([k,L])=>[esc(k),L.length,L.reduce((t,x)=>t+q(x),0)]),who=grp(B,x=>(x.person||'').trim()).map(([k,L])=>[esc(k),L.length,L.reduce((t,x)=>t+q(x),0)]);
 return `<h3>Stock report · ${rLabel()}</h3><div class="grid">${RC('GRNs received',G.length)}${RC('Items received (qty)',rows.reduce((t,r)=>t+r.inn,0))}${RC('Items issued (qty)',rows.reduce((t,r)=>t+r.out,0))}${RC('Sign-outs',B.length)}${RC('Assets acquired',A.length)}${RC('Items below reorder',S.item.filter(i=>qty(i.id)<=(+i.reorder||0)).length)}</div>
 <div class="card"><b>Goods flow over the period (quantity in vs out)</b>${vbars(bLabels(),[{n:'Received',v:series(M.filter(m=>m.type!=='OUT'),m=>m.date,m=>m.qty),c:'ac'},{n:'Issued',v:series(M.filter(m=>m.type==='OUT'),m=>m.date,m=>m.qty),c:'wa'}])}<div class="mu">Stock isn't priced yet, so charts show quantities.</div></div>
 <div class="card"><b>Issued by department (qty)</b>${hbar(grp(B,x=>(x.dept||'').trim()).map(([k,L])=>[k,L.reduce((t,x)=>t+q(x),0)]),'wa')}</div>
 <div class="card"><b>Most issued items (qty)</b>${hbar(rows.map(r=>[r.n,r.out]),'er')}</div>
 <div class="card"><b>Consumption by item</b>${T(['Item','Issued','Per week','On hand','Days cover'],rows.map(r=>{const i=S.item.find(x=>x.name===r.n),d=Math.max(1,(new Date(rng()[1])-new Date(a))/864e5),pd=r.out/d;return [esc(r.n),r.out,(pd*7).toFixed(1),i?qty(i.id):'',pd>0&&i?Math.round(qty(i.id)/pd):'—']}))}<div class="mu">Days cover = stock on hand ÷ average daily issue in this period.</div></div>
 <div class="card"><b>Stock movement</b>${T(['Item','Opening','In','Out','Closing'],rows.map(r=>[esc(r.n)+' <span class="mu">'+esc(r.u)+'</span>',r.op,r.inn,r.out,'<b>'+r.cl+'</b>']))}</div>
 <div class="card"><b>Issued by department</b>${T(['Department','Sign-outs','Qty'],dep)}</div>
 <div class="card"><b>Issued to people</b>${T(['Person','Sign-outs','Qty'],who)}</div>
 <div class="card"><b>Goods received notes</b>${T(['GRN','Supplier','Date','Lines'],G.map(g=>[esc(g.no),esc(g.supplier||'—'),esc(g.date),g.lines.length]))}</div>
 <div class="card"><b>Assets acquired</b>${T(['Asset','Tag','GRN','Assigned to'],A.map(x=>[esc(x.name),esc(x.tag||'—'),esc(x.grn||''),esc(x.custodian||'—')]))}</div>`}
const isPetty=p=>p.method==='Petty Cash';
const cfg=()=>S.cfg.find(x=>x.id==='main')||{id:'main',limit:500000,approvers:['Procurement Officer','Chief Finance Officer']};
const recvOk=p=>(p.handling||'').startsWith('Not')?!!p.directRecv:(S.grn.some(g=>g.pr===p.id)||!!p.directRecv);
const stageOf=p=>isPetty(p)?((+p.paid>0&&p.payDate)?'Paid':recvOk(p)?'Delivered':isAppr(p)?'Approved':p.chosen?'Selected':'Requested'):stageOf0(p);
function settingsForm(){if(!canW('cfg'))return;const c=cfg();form('Settings · petty cash',[['limit','Petty cash limit (UGX): purchases up to this amount are petty cash','num'],['ap','Petty cash approvers (one per line: title or name)','area']],{...c,ap:(c.approvers||[]).join('\n')},r=>{const o={id:'main',limit:+r.limit||0,approvers:(r.ap||'').split('\n').map(x=>x.trim()).filter(Boolean)};save('cfg',o).then(closeM)})}
function pettyBuy(id){const p=get('pr',id);form('Supplier & amount',[['supplier','Supplier (type a new one or pick)','sup'],['contract','Amount (UGX)','num']],{...p},r=>{const L=+cfg().limit;if(!(r.supplier||'').trim()||!(+r.contract>0))return alert('Enter the supplier and amount.');if(+r.contract>L)return alert('Amount exceeds the petty cash limit of UGX '+fmt(L)+'.');r.quotes=[{id:'pq',supplier:r.supplier.trim(),price:+r.contract,quality:3,spec:'Yes',ontime:'Yes'}];r.chosen='pq';r.reason=r.purpose;sv(r)})}
function directForm(id){const p=get('pr',id);form('Direct receipt (not stocked)',[['_n','Received by (name)'],['_d','Date','date']],{...p,_n:p.reqBy||'',_d:today()},r=>{if(!(r._n||'').trim())return alert('Enter the name.');r.directRecv={by:r._n.trim(),at:r._d||today()};delete r._n;delete r._d;sv(r)})}
function pickForm(gid){const g=get('grn',gid),p=get('pr',g.pr)||{};form('Picked up from store',[['_n','Picked up by (name)'],['_d','Date','date']],{...g,_n:p.reqBy||'',_d:today()},async r=>{const n=(r._n||'').trim(),d=r._d||today();if(!n)return alert('Enter the name.');delete r._n;delete r._d;r.pickedBy=n;r.pickDate=d;
 for(const l of r.lines){if(l.kind==='asset'){for(const a of S.asset.filter(a=>a.grn===r.no&&nk(a.name)===nk(l.name)))await save('asset',{...a,custodian:n})}else{const it=S.item.find(x=>nk(x.name)===nk(l.name));if(it)await save('mv',{id:uid('m'),item:it.id,type:'OUT',qty:l.qty,date:d,person:n,dept:p.dept||'',ref:'Pickup '+r.no})}}
 await save('grn',r);grnView(gid)})}
function pettyPay(id){const p=get('pr',id);if(!p.chosen)return alert('Record the supplier and amount first.');if(!isAppr(p))return alert('The petty cash approvers must sign first.');if(!recvOk(p))return alert('Goods must be received first (by the store manager, or directly if not stocked).');
 form('Petty cash payment',[['paid','Amount paid (UGX)','num'],['payDate','Payment date','date'],['payMode','Paid by','sel',['Cash','Mobile money','Bank transfer']],['recvName','CASH: name of person who received the money'],['momoNo','MOBILE MONEY: number'],['momoName','MOBILE MONEY: registered name'],['bank','BANK: bank name'],['acct','BANK: account number'],['acctName','BANK: account name']],{...p,paid:p.paid||p.contract,payDate:p.payDate||today(),payMode:p.payMode||'Cash'},r=>{const m=r.payMode;
  if(!(+r.paid>0))return alert('Enter the amount paid.');if(+r.paid>+cfg().limit)return alert('Exceeds the petty cash limit of UGX '+fmt(cfg().limit));
  if(m==='Cash'&&!(r.recvName||'').trim())return alert('Enter the name of the person who received the cash.');
  if(m==='Mobile money'&&!(r.momoNo||'').trim())return alert('Enter the mobile money number.');
  if(m==='Bank transfer'&&!((r.bank||'').trim()&&(r.acct||'').trim()))return alert('Enter the bank and account number.');
  sv(r)})}
function pettyView(id){const p=get('pr',id);p.stage=stageOf(p);const B=(l,f,c='s')=>`<button class="${c}" onclick="${f}">${l}</button>`,sec=(t,b)=>`<div class="card"><b>${t}</b><div style="margin-top:6px">${b}</div></div>`;
 const th=t=>(p.docs||[]).filter(d=>d.type===t).map(d=>`<a href="#" onclick="openDoc('${esc(d.url)}');return false">📎 ${esc(d.name)}</a>`).join('<br>')||'<span class="mu">none yet</span>';
 const h=p.handling||'Add to stock/assets',direct=h.startsWith('Not'),grns=S.grn.filter(g=>g.pr===p.id);
 const pay=p.paid>0?`UGX ${fmt(p.paid)} on ${esc(p.payDate)} · ${esc(p.payMode||'')}<br>`+(p.payMode==='Cash'?'Received by <b>'+esc(p.recvName)+'</b>':p.payMode==='Mobile money'?'Mobile money '+esc(p.momoNo)+' ('+esc(p.momoName||'')+')':'Bank '+esc(p.bank)+' · acct '+esc(p.acct)+' ('+esc(p.acctName||'')+')'):B('Record payment',`payForm('${id}')`);
 const rb=direct?(p.directRecv?`<div class="mu">Received directly by ${esc(p.directRecv.by)} on ${esc(p.directRecv.at)}</div>`:B('Record direct receipt',`directForm('${id}')`)):(canW('grn')?B('Receive via GRN (store manager)',`recvForm('${id}')`):'<span class="mu">Awaiting the store manager’s GRN</span>');
 const pk=grns.find(g=>g.pickedBy),hold=h.startsWith('Hold')&&grns.length?(pk?`<div class="mu">Picked up by ${esc(pk.pickedBy)} on ${esc(pk.pickDate)}</div>`:chip('Held in store for '+(p.reqBy||'requester'),'w')+' <span class="mu">Released by the store manager from the GRN.</span>'):'';
 const goods=(recvOk(p)?chip('Received'):chip('Not yet received','w'))+grns.map(g=>`<div class="mu">${esc(g.no)} · ${esc(g.date)} · ${g.lines.length} line(s)</div>`).join('')+'<div style="margin-top:6px">'+rb+' '+hold+'</div>';
 openM(`<div class="row"><h3 style="margin:0">${esc(p.ref)} · ${esc(p.desc)}</h3>${B('✕','closeM()')}</div><p>${chip('Petty cash')} ${chip(p.stage)} ${payChip(p)}</p>
 <p><span class="k">Reason for purchase</span><br>${esc(p.purpose||'—')}<br><span class="k">${esc(p.dept||'')} · requested by ${esc(p.reqBy||'—')} · qty ${p.qty||'—'} · limit UGX ${fmt(cfg().limit)}</span></p>
 ${sec('1 · Supplier & amount',p.chosen?`<b>${esc(p.supplier)}</b> · UGX ${fmt(p.contract)}`:B('Record supplier & amount',`pettyBuy('${id}')`))}
 ${sec('2 · Approval',signHtml(p))}
 ${sec('3 · Goods · '+esc(h),goods)}
 ${sec('4 · Payment',pay)}
 ${sec('Receipts & proof',`Receipt: ${th('Receipt')}<br>Proof of payment: ${th('Proof of payment')}<div class="bar">${B('📷 Receipt',`scan('${id}','Receipt')`)}${B('📷 Proof',`scan('${id}','Proof of payment')`)}</div>`)}
 <div class="bar">${B('Edit',`prForm('${id}')`)}${B('Delete',`del('pr','${id}')`,'s d')}</div>`);lockM('pr')}
function sample(){
 save('pr',{id:uid('p'),created:today(),ref:'PR-001',desc:'Office chairs',purpose:'Replace broken chairs',dept:'Risk',reqBy:'Risk Officer',method:'RFQ',approved:6000000,rfqDate:today(),channel:'Email',closing:today(),quotes:[{id:'q1',supplier:'Metric Furniture Ltd',price:1840000,quality:4,spec:'Yes',ontime:'Yes'},{id:'q2',supplier:'Hoima Interiors',price:2100000,quality:3,spec:'No',ontime:'Yes'}],docs:[]});
 save('pr',{id:uid('p'),created:today(),ref:'PR-002',desc:'Tyres for UBE 812V',purpose:'Vehicle unsafe',dept:'HR',method:'Sole Sourcing',emergency:'Vehicle grounded; needed for field duty',approved:3000000,docs:[]});
 save('item',{id:uid('i'),name:'A4 Paper',sku:'STA-001',unit:'reams',reorder:20});save('item',{id:uid('i'),name:'UPS Battery 12V',sku:'IT-014',unit:'pcs',reorder:4})}
init();
</script></body></html>
